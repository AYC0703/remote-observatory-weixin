; 远程天文台顶盖控制器 —— PlatformIO 工程配置
;
; 用法：
;   cd firmware/cover-controller
;   cp config.example.h config.h   # 然后填入 Wi-Fi 与设备令牌
;   pio run -t upload              # 编译并烧录
;   pio device monitor             # 查看串口日志（115200）
;
; 若用 Arduino IDE：把 cover-controller/ 下的 .ino 与 config.h 放在同名文件夹中打开即可。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

